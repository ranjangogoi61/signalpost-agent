name: ci
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --frozen
      - name: Unit tests
        run: uv run --with pytest pytest -q
      - name: Select 100-company smoke batch
        run: |
          curl -fsSL https://builderr.ai/signalpost-company-universe-2025.jsonl.gz -o universe.jsonl.gz
          uv run python select_entry_batch.py --universe universe.jsonl.gz --count 100 --output smoke-companies.jsonl
      - name: Live 100-company smoke run
        run: |
          uv run python scripts/run_signalpost.py \
            --organisations smoke-companies.jsonl \
            --output out/envelopes.jsonl --profiles-output out/profiles.jsonl \
            --report out/run-report.json --run-id ci-smoke --expected-count 100
      - name: Bulk snapshot run (the reference kit's --bulk path) and parity with the live run
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/dev'
        run: |
          curl -fsSL https://data.brreg.no/enhetsregisteret/api/enheter/lastned/csv -o brreg-enheter.csv.gz
          ls -l brreg-enheter.csv.gz; head -c 2 brreg-enheter.csv.gz | od -An -tx1
          (zcat brreg-enheter.csv.gz 2>/dev/null || cat brreg-enheter.csv.gz) | head -1 | tr ';,' '\n\n' | sed 's/"//g' > out/bulk-header.txt || true
          uv run python scripts/run_signalpost.py --organisations smoke-companies.jsonl --bulk brreg-enheter.csv.gz \
            --output out/envelopes-bulk.jsonl --profiles-output out/profiles-bulk.jsonl --report out/run-report-bulk.json \
            --run-id ci-bulk --expected-count 100 --no-jobs --no-discovery
          uv run python tools/compare_runs.py out/envelopes.jsonl out/envelopes-bulk.jsonl out/parity.json
      - name: Build and check the offline viewer (demo hides person names)
        run: |
          uv run python scripts/build_viewer.py --envelopes out/envelopes.jsonl --report out/run-report.json --out out/demo/index.html --hide-person-names
          cd /tmp && npm init -y >/dev/null && npm i jsdom --silent && cd "$GITHUB_WORKSPACE" && NODE_PATH=/tmp/node_modules node tools/check_viewer.js out/demo/index.html --names-hidden
      - name: Refresh run (same input, must report no false changes)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/dev'
        run: |
          uv run python scripts/run_signalpost.py \
            --organisations smoke-companies.jsonl \
            --output out/envelopes2.jsonl --profiles-output out/profiles.jsonl \
            --report out/run-report2.json --run-id ci-smoke-2 --expected-count 100
      - name: Summarize (counts only)
        if: always()
        run: |
          uv run python scripts/summarize_run.py --envelopes out/envelopes.jsonl --report out/run-report.json --output out/summary.json
          if [ -f out/envelopes2.jsonl ]; then uv run python scripts/summarize_run.py --envelopes out/envelopes2.jsonl --report out/run-report2.json --output out/summary2.json; fi
      - name: Publish counts-only summary to smoke-results branch
        if: always()
        run: |
          mkdir -p /tmp/results && cp out/summary.json out/run-report.json out/summary2.json /tmp/results/ 2>/dev/null || true
          cp out/demo/index.html /tmp/results/index.html 2>/dev/null || true
          cp out/parity.json out/run-report-bulk.json out/bulk-header.txt /tmp/results/ 2>/dev/null || true
          git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git checkout --orphan smoke-results && git rm -rf -q . 2>/dev/null || true
          cp /tmp/results/* . 2>/dev/null; git add summary.json run-report.json; [ -f summary2.json ] && git add summary2.json; [ -f index.html ] && git add index.html; [ -f parity.json ] && git add parity.json; [ -f run-report-bulk.json ] && git add run-report-bulk.json; [ -f bulk-header.txt ] && git add bulk-header.txt; git commit -q -m "smoke results for ${GITHUB_SHA::7}"
          git push -f origin smoke-results
