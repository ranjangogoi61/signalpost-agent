name: smoke

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: BRREG live smoke test
        run: |
          printf '923609016\n' > smoke_input.txt
          python run.py --input smoke_input.txt --output smoke_output.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(line) for line in Path('smoke_output.jsonl').read_text().splitlines()]
          assert len(rows) == 1, rows
          assert rows[0]['status'] == 'available', rows
          assert rows[0]['profile']['facts'][0]['key'] == 'organisation_number', rows
          print('BRREG smoke test passed')
          PY
