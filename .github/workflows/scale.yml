name: scale
on:
  push:
    branches: [scale-test]
permissions:
  contents: write
jobs:
  scale-1000:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --frozen
      - name: Select batch and run 1,000 companies with the submitted command
        run: |
          set +e
          mkdir -p out
          {
            curl -fsSL https://builderr.ai/signalpost-company-universe-2025.jsonl.gz -o universe.jsonl.gz; echo "curl=$?"
            uv run python select_entry_batch.py --universe universe.jsonl.gz --count 1000 --output scale-companies.jsonl; echo "select=$?"
            wc -l scale-companies.jsonl
            START=$(date +%s)
            uv run python scripts/run_signalpost.py --organisations scale-companies.jsonl \
              --output out/envelopes.jsonl --profiles-output out/profiles.jsonl \
              --report out/run-report.json --run-id ci-scale --expected-count 1000; echo "run_exit=$?"
            echo "wall_seconds=$(( $(date +%s) - START ))"
            wc -l out/envelopes.jsonl
            uv run python scripts/summarize_run.py --envelopes out/envelopes.jsonl --report out/run-report.json --output out/scale-summary.json > /dev/null; echo "summary=$?"
            uv run python scripts/build_viewer.py --envelopes out/envelopes.jsonl --report out/run-report.json --out out/profiles-1000.html --hide-person-names; echo "viewer=$?"
          } > out/log.txt 2>&1
          grep -vE "Nordmann" out/log.txt | grep -E "=|envelopes|companies|Error|Traceback|line [0-9]+" | tail -40 > out/scale-log.txt
          cat out/scale-log.txt
      - name: Publish counts to scale-results
        if: always()
        run: |
          mkdir -p /tmp/r && cp out/scale-summary.json out/scale-log.txt out/profiles-1000.html /tmp/r/ 2>/dev/null; ls -l /tmp/r
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout -q --orphan scale-results && git rm -rqf . && rm -rf out scale-companies.jsonl universe.jsonl.gz src/norway_company_agent/__pycache__
          cp /tmp/r/* . ; git add scale-summary.json scale-log.txt profiles-1000.html 2>/dev/null; git commit -qm "scale results for ${GITHUB_SHA::7}" && git push -qf origin scale-results
