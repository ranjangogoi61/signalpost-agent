name: ui-check
on:
  push:
    branches: [ui-check]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: get the demo viewer built by CI
        run: |
          git fetch origin smoke-results
          git show origin/smoke-results:index.html > /tmp/demo.html
          ls -l /tmp/demo.html
      - name: screenshots
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright --silent && npx playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE" && NODE_PATH=/tmp/pw/node_modules node tools/ui_shots.js /tmp/demo.html /tmp/shots
      - name: publish screenshots
        run: |
          git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git checkout --orphan ui-shots && git rm -rf -q . 2>/dev/null || true
          cp /tmp/shots/* . && git add *.png report.txt && git commit -q -m "ui screenshots" && git push -f origin ui-shots
